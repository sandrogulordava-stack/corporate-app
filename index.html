<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>კორპორატიული ვებსაიტი</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<!-- კონფლიქტის ადგილი: ზუსტად ეს სტრიქონი გამოიყენეთ კონფლიქტისთვის -->
  <main class="hero-wrapper">
    
    <!-- Hero Section -->
    <section class="hero-section">
      <div class="hero-container">
        <h1 class="hero-title">ინოვაციური ბიზნეს გადაწყვეტილებები</h1>
        <p class="hero-subtitle">შექმენი და განავითარე შენი პროექტი თანამედროვე სტანდარტებით.</p>
        <div class="hero-cta">
          <a href="#get-started" class="btn btn-primary">დაიწყე ახლავე</a>
          <a href="#solutions" class="btn btn-ghost">გაიგე მეტი</a>
        </div>
      </div>
    </section>

    <!-- Banner Section -->
    <section class="banner-section">
      <div class="banner-container">
        <div class="banner-content">
          <h3>სპეციალური შეთავაზება ახალი პარტნიორებისთვის</h3>
          <p>მიიღე პროფესიონალური კონსულტაცია სრულიად უფასოდ.</p>
        </div>
      </div>
    </section>

  </main>

</body>
</html>
